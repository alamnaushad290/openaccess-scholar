name: Weekly Journal Data Update

on:
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at midnight UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run journal fetch script
        run: node scripts/fetch-journals.mjs
        env:
          CROSSREF_EMAIL: ${{ secrets.CROSSREF_EMAIL }}

      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet public/data.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push updated data
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add public/data.json
          git commit -m "chore: auto-update journal data [$(date -u '+%Y-%m-%d')]"
          git push

      - name: No changes detected
        if: steps.check_changes.outputs.changed != 'true'
        run: echo "No changes in journal data. Skipping commit."
