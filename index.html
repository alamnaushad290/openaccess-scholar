<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenAccess Scholar — Free Journal & Conference Finder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    * { font-family: 'Inter', system-ui, sans-serif; }
    .card-hover { transition: transform 0.2s ease, box-shadow 0.2s ease; }
    .card-hover:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(0,0,0,0.12); }
    .modal-overlay { animation: fadeIn 0.2s ease; }
    .modal-box { animation: slideUp 0.25s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .card-anim { animation: cardFadeIn 0.4s ease both; }
    @keyframes cardFadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .skeleton { background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .sidebar-scroll { max-height: calc(100vh - 120px); overflow-y: auto; }
    .sidebar-scroll::-webkit-scrollbar { width: 4px; }
    .sidebar-scroll::-webkit-scrollbar-track { background: transparent; }
    .sidebar-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .match-bar { transition: width 0.6s ease; }
    .kw-chip:hover { background: #3b82f6; color: white; }
    .hamburger-line { transition: all 0.3s ease; }
    .mobile-sidebar { transition: transform 0.3s ease; }
    .mobile-sidebar.open { transform: translateX(0); }
    .mobile-sidebar.closed { transform: translateX(-100%); }
    input[type=checkbox], input[type=radio] { accent-color: #3b82f6; }
    .abstract-card { transition: all 0.3s ease; }
    .progress-bar-container { background: #e2e8f0; border-radius: 999px; overflow: hidden; height: 6px; }
    .progress-bar-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #3b82f6, #06b6d4); }
    .filter-badge { animation: pop 0.2s ease; }
    @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: '#0f172a',
            'navy-light': '#1e293b',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 min-h-screen">

<!-- ===== HEADER ===== -->
<header class="sticky top-0 z-40 bg-gradient-to-r from-slate-900 via-blue-950 to-slate-900 shadow-2xl">
  <div class="max-w-screen-xl mx-auto px-4 py-4 flex items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <button id="hamburger-btn" class="lg:hidden flex flex-col gap-1.5 p-2 rounded-lg hover:bg-white/10 transition" aria-label="Toggle sidebar">
        <span class="hamburger-line block w-5 h-0.5 bg-white"></span>
        <span class="hamburger-line block w-5 h-0.5 bg-white"></span>
        <span class="hamburger-line block w-5 h-0.5 bg-white"></span>
      </button>
      <div>
        <h1 class="text-xl sm:text-2xl font-bold text-white tracking-tight flex items-center gap-2">
          <span class="text-blue-400">⬡</span> OpenAccess Scholar
        </h1>
        <p class="text-blue-300 text-xs sm:text-sm font-medium mt-0.5">Find Free-to-Publish Journals &amp; Conferences</p>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <span class="hidden sm:flex items-center gap-1.5 bg-green-500/20 text-green-300 text-xs font-semibold px-3 py-1.5 rounded-full border border-green-500/30">
        <span class="w-1.5 h-1.5 bg-green-400 rounded-full animate-pulse"></span> 20 Free Venues
      </span>
    </div>
  </div>
</header>

<!-- ===== MOBILE SIDEBAR BACKDROP ===== -->
<div id="sidebar-backdrop" class="fixed inset-0 bg-black/50 z-30 lg:hidden hidden" onclick="closeSidebar()"></div>

<!-- ===== MAIN LAYOUT ===== -->
<div class="max-w-screen-xl mx-auto px-4 py-6 flex gap-6 relative">

  <!-- ===== SIDEBAR ===== -->
  <aside id="sidebar" class="mobile-sidebar closed fixed top-0 left-0 h-full z-40 lg:z-auto lg:static lg:transform-none w-72 shrink-0 pt-16 lg:pt-0">
    <div class="bg-white rounded-2xl shadow-lg border border-slate-100 sidebar-scroll p-5 sticky top-24">

      <!-- Filter Header -->
      <div class="flex items-center justify-between mb-5">
        <h2 class="font-bold text-slate-800 text-sm uppercase tracking-wider flex items-center gap-2">
          <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2a1 1 0 01-.293.707L13 13.414V19a1 1 0 01-.553.894l-4 2A1 1 0 017 21v-7.586L3.293 6.707A1 1 0 013 6V4z"/></svg>
          Filters
          <span id="filter-count-badge" class="hidden filter-badge bg-blue-500 text-white text-xs font-bold px-1.5 py-0.5 rounded-full min-w-[20px] text-center">0</span>
        </h2>
        <button onclick="resetFilters()" class="text-xs text-blue-500 hover:text-blue-700 font-semibold transition">Reset All</button>
      </div>

      <!-- Index Filter -->
      <div class="mb-5">
        <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Index</h3>
        <div class="space-y-2">
          <label class="flex items-center gap-2.5 cursor-pointer group">
            <input type="checkbox" value="Scopus" onchange="applyFilters()" class="filter-index w-4 h-4 rounded" />
            <span class="text-sm text-slate-700 group-hover:text-blue-600 transition font-medium">Scopus</span>
            <span class="ml-auto bg-blue-100 text-blue-700 text-xs px-1.5 py-0.5 rounded font-semibold">20</span>
          </label>
          <label class="flex items-center gap-2.5 cursor-pointer group">
            <input type="checkbox" value="WoS" onchange="applyFilters()" class="filter-index w-4 h-4 rounded" />
            <span class="text-sm text-slate-700 group-hover:text-blue-600 transition font-medium">WoS</span>
            <span class="ml-auto bg-green-100 text-green-700 text-xs px-1.5 py-0.5 rounded font-semibold">9</span>
          </label>
          <label class="flex items-center gap-2.5 cursor-pointer group">
            <input type="checkbox" value="SCI" onchange="applyFilters()" class="filter-index w-4 h-4 rounded" />
            <span class="text-sm text-slate-700 group-hover:text-blue-600 transition font-medium">SCI</span>
            <span class="ml-auto bg-orange-100 text-orange-700 text-xs px-1.5 py-0.5 rounded font-semibold">3</span>
          </label>
          <label class="flex items-center gap-2.5 cursor-pointer group">
            <input type="checkbox" value="SCIE" onchange="applyFilters()" class="filter-index w-4 h-4 rounded" />
            <span class="text-sm text-slate-700 group-hover:text-blue-600 transition font-medium">SCIE</span>
            <span class="ml-auto bg-red-100 text-red-700 text-xs px-1.5 py-0.5 rounded font-semibold">8</span>
          </label>
        </div>
      </div>

      <hr class="border-slate-100 mb-5"/>

      <!-- Type Filter -->
      <div class="mb-5">
        <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Type</h3>
        <div class="space-y-2">
          <label class="flex items-center gap-2.5 cursor-pointer group">
            <input type="radio" name="filter-type" value="all" checked onchange="applyFilters()" class="w-4 h-4" />
            <span class="text-sm text-slate-700 group-hover:text-blue-600 transition font-medium">All</span>
          </label>
          <label class="flex items-center gap-2.5 cursor-pointer group">
            <input type="radio" name="filter-type" value="journal" onchange="applyFilters()" class="w-4 h-4" />
            <span class="text-sm text-slate-700 group-hover:text-blue-600 transition font-medium">Journals</span>
          </label>
          <label class="flex items-center gap-2.5 cursor-pointer group">
            <input type="radio" name="filter-type" value="conference" onchange="applyFilters()" class="w-4 h-4" />
            <span class="text-sm text-slate-700 group-hover:text-blue-600 transition font-medium">Conferences</span>
          </label>
        </div>
      </div>

      <hr class="border-slate-100 mb-5"/>

      <!-- Domain Filter -->
      <div class="mb-5">
        <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Domain</h3>
        <div id="domain-filters" class="space-y-2 max-h-48 overflow-y-auto pr-1"></div>
      </div>

      <hr class="border-slate-100 mb-5"/>

      <!-- Quartile Filter -->
      <div class="mb-2">
        <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Quartile</h3>
        <div class="space-y-2">
          <label class="flex items-center gap-2.5 cursor-pointer group">
            <input type="checkbox" value="Q1" onchange="applyFilters()" class="filter-quartile w-4 h-4 rounded" />
            <span class="text-sm text-slate-700 group-hover:text-blue-600 transition font-medium">Q1</span>
            <span class="ml-auto text-yellow-600 text-xs font-bold">🥇</span>
          </label>
          <label class="flex items-center gap-2.5 cursor-pointer group">
            <input type="checkbox" value="Q2" onchange="applyFilters()" class="filter-quartile w-4 h-4 rounded" />
            <span class="text-sm text-slate-700 group-hover:text-blue-600 transition font-medium">Q2</span>
            <span class="ml-auto text-slate-400 text-xs font-bold">🥈</span>
          </label>
          <label class="flex items-center gap-2.5 cursor-pointer group">
            <input type="checkbox" value="Q3" onchange="applyFilters()" class="filter-quartile w-4 h-4 rounded" />
            <span class="text-sm text-slate-700 group-hover:text-blue-600 transition font-medium">Q3</span>
            <span class="ml-auto text-amber-700 text-xs font-bold">🥉</span>
          </label>
          <label class="flex items-center gap-2.5 cursor-pointer group">
            <input type="checkbox" value="Q4" onchange="applyFilters()" class="filter-quartile w-4 h-4 rounded" />
            <span class="text-sm text-slate-700 group-hover:text-blue-600 transition font-medium">Q4</span>
            <span class="ml-auto text-slate-400 text-xs">◇</span>
          </label>
          <label class="flex items-center gap-2.5 cursor-pointer group">
            <input type="checkbox" value="N/A" onchange="applyFilters()" class="filter-quartile w-4 h-4 rounded" />
            <span class="text-sm text-slate-700 group-hover:text-blue-600 transition font-medium">N/A (Conf.)</span>
          </label>
        </div>
      </div>

    </div>
  </aside>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="flex-1 min-w-0">

    <!-- Abstract Matcher -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 mb-6 overflow-hidden abstract-card">
      <button onclick="toggleAbstract()" class="w-full flex items-center justify-between p-5 hover:bg-slate-50 transition group">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-cyan-500 rounded-xl flex items-center justify-center shadow-md">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
          </div>
          <div class="text-left">
            <h2 class="font-bold text-slate-800 text-base">Abstract Matcher</h2>
            <p class="text-slate-500 text-xs mt-0.5">Paste your abstract to find the best-matching venues</p>
          </div>
        </div>
        <svg id="abstract-chevron" class="w-5 h-5 text-slate-400 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
      </button>
      <div id="abstract-panel" class="hidden px-5 pb-5">
        <textarea id="abstract-input" rows="5" placeholder="Paste your research abstract here to find matching journals and conferences based on keyword and topic alignment..." class="w-full border border-slate-200 rounded-xl p-4 text-sm text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent resize-none transition"></textarea>
        <div class="flex gap-3 mt-3 flex-wrap">
          <button onclick="runAbstractMatch()" class="flex items-center gap-2 bg-gradient-to-r from-blue-600 to-cyan-500 text-white text-sm font-semibold px-5 py-2.5 rounded-xl hover:from-blue-700 hover:to-cyan-600 transition shadow-md hover:shadow-lg">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            Find Matching Journals
          </button>
          <button onclick="clearAbstractMatch()" id="clear-match-btn" class="hidden items-center gap-2 bg-slate-100 text-slate-600 text-sm font-semibold px-4 py-2.5 rounded-xl hover:bg-slate-200 transition">
            ✕ Clear Match
          </button>
        </div>
      </div>
    </div>

    <!-- Match Banner -->
    <div id="match-banner" class="hidden bg-gradient-to-r from-blue-50 to-cyan-50 border border-blue-200 rounded-xl px-5 py-3.5 mb-5 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2 text-blue-700 font-semibold text-sm">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span id="match-banner-text">Showing 0 matches for your abstract</span>
      </div>
      <button onclick="clearAbstractMatch()" class="text-blue-500 hover:text-blue-700 text-xs font-bold transition">Clear ✕</button>
    </div>

    <!-- Search Bar -->
    <div class="flex gap-3 mb-5 items-center">
      <div class="relative flex-1">
        <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input id="search-input" type="text" placeholder="Search by title, ISSN, or publisher..." oninput="applyFilters()" class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-xl text-sm text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent bg-white shadow-sm transition" />
      </div>
      <div class="shrink-0 bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm font-semibold text-slate-600 shadow-sm whitespace-nowrap">
        <span id="results-count">20</span> <span class="text-slate-400 font-normal">of 20</span>
      </div>
    </div>

    <!-- Cards Grid -->
    <div id="cards-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-5">
      <!-- Skeleton placeholders -->
      <div class="skeleton h-72 rounded-2xl"></div>
      <div class="skeleton h-72 rounded-2xl"></div>
      <div class="skeleton h-72 rounded-2xl"></div>
      <div class="skeleton h-72 rounded-2xl hidden sm:block"></div>
      <div class="skeleton h-72 rounded-2xl hidden xl:block"></div>
      <div class="skeleton h-72 rounded-2xl hidden xl:block"></div>
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="hidden flex flex-col items-center justify-center py-20 text-center">
      <svg class="w-32 h-32 mb-6 text-slate-200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="100" cy="100" r="90" fill="#f1f5f9"/>
        <rect x="60" y="55" width="80" height="100" rx="8" fill="#e2e8f0"/>
        <rect x="72" y="70" width="56" height="8" rx="4" fill="#cbd5e1"/>
        <rect x="72" y="84" width="40" height="8" rx="4" fill="#cbd5e1"/>
        <rect x="72" y="98" width="48" height="8" rx="4" fill="#cbd5e1"/>
        <circle cx="130" cy="135" r="22" fill="#f8fafc" stroke="#e2e8f0" stroke-width="3"/>
        <line x1="146" y1="151" x2="160" y2="165" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
        <line x1="122" y1="128" x2="138" y2="128" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="130" y1="120" x2="130" y2="136" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <h3 class="text-xl font-bold text-slate-500 mb-2">No results found</h3>
      <p class="text-slate-400 text-sm max-w-xs">Try adjusting your filters or search query to discover more venues.</p>
      <button onclick="resetFilters()" class="mt-5 bg-blue-500 text-white px-5 py-2.5 rounded-xl text-sm font-semibold hover:bg-blue-600 transition">Reset Filters</button>
    </div>

  </main>
</div>

<!-- ===== DETAIL MODAL ===== -->
<div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
  <div class="modal-overlay fixed inset-0 bg-black/60 backdrop-blur-sm" onclick="closeModal()"></div>
  <div class="modal-box relative bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto z-10">
    <div id="modal-content"></div>
  </div>
</div>

// ========== STATE ==========
let matchScores = {};
let isMatchMode = false;
let abstractOpen = false;
let currentEntry = null;

// ========== STOPWORDS ==========
const STOPWORDS = new Set([
  "a","an","the","and","or","but","in","on","at","to","for","of","with","by","from","up","about",
  "into","through","during","is","are","was","were","be","been","being","have","has","had","do",
  "does","did","will","would","could","should","may","might","shall","can","need","it","its",
  "this","that","these","those","i","we","you","he","she","they","our","their","your","his","her",
  "which","who","whom","all","each","every","both","few","more","most","other","such","than",
  "as","if","then","when","where","how","not","no","nor","so","yet","just","also","even","new",
  "results","research","study","paper","propose","proposed","presents","based","using","used",
  "approach","method","methods","data","model","models","show","shows","shown","analysis","provide"
]);

// ========== ABSTRACT MATCHING ==========
function tokenize(text) {
  return text.toLowerCase().replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter(t => t.length > 2 && !STOPWORDS.has(t));
}

function computeMatchScore(entry, abstractTokens) {
  if (abstractTokens.length === 0) return 0;
  const entryText = (entry.keywords.join(' ') + ' ' + entry.aims + ' ' + entry.title + ' ' + entry.subDomains.join(' ')).toLowerCase();
  const entryTokens = tokenize(entryText);
  let score = 0;
  const tokenFreq = {};
  abstractTokens.forEach(t => { tokenFreq[t] = (tokenFreq[t] || 0) + 1; });

  entry.keywords.forEach(kw => {
    const kwLower = kw.toLowerCase();
    if (abstractTokens.includes(kwLower)) score += 15;
    else if (abstractTokens.some(t => kwLower.includes(t) || t.includes(kwLower))) score += 7;
  });

  const aimTokens = tokenize(entry.aims);
  const matchingAimTokens = abstractTokens.filter(t => aimTokens.includes(t));
  score += matchingAimTokens.length * 3;

  const domainTokens = tokenize(entry.domain + ' ' + entry.subDomains.join(' '));
  const matchingDomainTokens = abstractTokens.filter(t => domainTokens.includes(t));
  score += matchingDomainTokens.length * 5;

  return Math.min(100, Math.round(score));
}

function runAbstractMatch() {
  const abstract = document.getElementById('abstract-input').value.trim();
  if (!abstract) { alert('Please paste your abstract first.'); return; }
  const tokens = tokenize(abstract);
  matchScores = {};
  data.forEach(entry => { matchScores[entry.id] = computeMatchScore(entry, tokens); });
  isMatchMode = true;
  document.getElementById('clear-match-btn').classList.remove('hidden');
  document.getElementById('clear-match-btn').classList.add('inline-flex');
  applyFilters();
}

function clearAbstractMatch() {
  matchScores = {};
  isMatchMode = false;
  document.getElementById('clear-match-btn').classList.add('hidden');
  document.getElementById('clear-match-btn').classList.remove('inline-flex');
  document.getElementById('match-banner').classList.add('hidden');
  applyFilters();
}

// ========== FILTERS ==========
function getActiveFilters() {
  const indexes = [...document.querySelectorAll('.filter-index:checked')].map(c => c.value);
  const type = document.querySelector('input[name="filter-type"]:checked')?.value || 'all';
  const domains = [...document.querySelectorAll('.filter-domain:checked')].map(c => c.value);
  const quartiles = [...document.querySelectorAll('.filter-quartile:checked')].map(c => c.value);
  const search = document.getElementById('search-input').value.trim().toLowerCase();
  return { indexes, type, domains, quartiles, search };
}

function countActiveFilters() {
  const f = getActiveFilters();
  return f.indexes.length + (f.type !== 'all' ? 1 : 0) + f.domains.length + f.quartiles.length + (f.search ? 1 : 0);
}

function updateFilterBadge() {
  const count = countActiveFilters();
  const badge = document.getElementById('filter-count-badge');
  if (count > 0) { badge.textContent = count; badge.classList.remove('hidden'); }
  else badge.classList.add('hidden');
}

function applyFilters() {
  const f = getActiveFilters();
  updateFilterBadge();

  let filtered = data.filter(entry => {
    if (f.indexes.length > 0 && !f.indexes.every(idx => entry.indexing.includes(idx))) return false;
    if (f.type !== 'all' && entry.type !== f.type) return false;
    if (f.domains.length > 0 && !f.domains.includes(entry.domain)) return false;
    if (f.quartiles.length > 0 && !f.quartiles.includes(entry.quartile)) return false;
    if (f.search) {
      const hay = (entry.title + entry.issn + entry.publisher + entry.abbreviation).toLowerCase();
      if (!hay.includes(f.search)) return false;
    }
    return true;
  });

  if (isMatchMode) {
    filtered = filtered.filter(e => (matchScores[e.id] || 0) > 5);
    filtered.sort((a, b) => (matchScores[b.id] || 0) - (matchScores[a.id] || 0));
    const banner = document.getElementById('match-banner');
    banner.classList.remove('hidden');
    document.getElementById('match-banner-text').textContent = `Showing ${filtered.length} match${filtered.length !== 1 ? 'es' : ''} for your abstract`;
  } else {
    document.getElementById('match-banner').classList.add('hidden');
  }

  document.getElementById('results-count').textContent = filtered.length;
  renderCards(filtered);
}

function resetFilters() {
  document.querySelectorAll('.filter-index, .filter-domain, .filter-quartile').forEach(c => c.checked = false);
  const allRadio = document.querySelector('input[name="filter-type"][value="all"]');
  if (allRadio) allRadio.checked = true;
  document.getElementById('search-input').value = '';
  clearAbstractMatch();
  document.getElementById('abstract-input').value = '';
  applyFilters();
}

// ========== DOMAIN FILTER BUILDER ==========
function buildDomainFilters() {
  const domains = [...new Set(data.map(e => e.domain))].sort();
  const container = document.getElementById('domain-filters');
  container.innerHTML = domains.map(d => `
    <label class="flex items-center gap-2.5 cursor-pointer group">
      <input type="checkbox" value="${d}" onchange="applyFilters()" class="filter-domain w-4 h-4 rounded" />
      <span class="text-sm text-slate-700 group-hover:text-blue-600 transition font-medium">${d}</span>
    </label>
  `).join('');
}

function getQuartileBadge(q) {
  const map = { 'Q1': 'bg-yellow-50 text-yellow-700 border border-yellow-300', 'Q2': 'bg-slate-100 text-slate-600 border border-slate-300', 'Q3': 'bg-amber-50 text-amber-700 border border-amber-300', 'Q4': 'bg-gray-100 text-gray-500 border border-gray-300', 'N/A': 'bg-purple-50 text-purple-600 border border-purple-200' };

function getCountryFlag(country) {

}

    const score = matchScores[entry.id] || 0;

    <div class="card-anim card-hover bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden flex flex-col cursor-pointer group" style="animation-delay:${i * 50}ms" onclick="openModal(${entry.id})">

      <div>
        <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Indexing & Quartile</h4>
        <div class="flex flex-wrap gap-2 items-center">
          ${entry.indexing.map(getIndexBadge).join('')}
          <span class="text-slate-200">|</span>
          ${getQuartileBadge(entry.quartile)}
        </div>
      </div>
      <!-- APC Highlight -->
      <div class="bg-green-50 border border-green-200 rounded-xl p-4 flex items-center gap-3">
        <div class="w-10 h-10 bg-green-500 rounded-xl flex items-center justify-center shrink-0 text-white text-lg">✓</div>
        <div>
          <p class="text-sm font-bold text-green-800">Free / No APC Required</p>
          <p class="text-xs text-green-600 mt-0.5">This venue charges zero article processing fees. Publish freely.</p>
        </div>
      </div>
      <!-- Aims & Scope -->
      <div>
        <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Aims & Scope</h4>
        <p class="text-sm text-slate-600 leading-relaxed">${entry.aims}</p>
      </div>
      <!-- Keywords -->
      <div>
        <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Keywords</h4>
        <div class="flex flex-wrap gap-2">
          ${entry.keywords.map(kw => `<span class="kw-chip text-xs font-medium px-3 py-1.5 bg-slate-100 text-slate-600 rounded-full cursor-pointer transition border border-slate-200 hover:border-blue-300" onclick="searchKeyword('${kw}')">${kw}</span>`).join('')}
        </div>
        <p class="text-xs text-slate-400 mt-2">Click a keyword to search for it</p>
      </div>
      <!-- Visit Button -->
      <a href="${entry.url}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center gap-2 w-full bg-gradient-to-r from-blue-600 to-cyan-500 text-white font-semibold py-3.5 rounded-xl hover:from-blue-700 hover:to-cyan-600 transition shadow-md hover:shadow-lg text-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
        🌐 Visit Official Page
      </a>
    </div>
  `;

  modal.classList.remove('hidden');
  modal.classList.add('flex');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  const modal = document.getElementById('modal');
  modal.classList.add('hidden');
  modal.classList.remove('flex');
  document.body.style.overflow = '';
}

function searchKeyword(kw) {
  closeModal();
  document.getElementById('search-input').value = kw;
  applyFilters();
}

// ========== ABSTRACT TOGGLE ==========
function toggleAbstract() {
  abstractOpen = !abstractOpen;
  const panel = document.getElementById('abstract-panel');
  const chevron = document.getElementById('abstract-chevron');
  if (abstractOpen) {
    panel.classList.remove('hidden');
    chevron.style.transform = 'rotate(180deg)';
  } else {
    panel.classList.add('hidden');
    chevron.style.transform = '';
  }
}

// ========== SIDEBAR MOBILE ==========
function openSidebar() {
  const sidebar = document.getElementById('sidebar');
  const backdrop = document.getElementById('sidebar-backdrop');
  sidebar.classList.remove('closed');
  sidebar.classList.add('open');
  backdrop.classList.remove('hidden');
  document.body.style.overflow = 'hidden';
}

function closeSidebar() {
  const sidebar = document.getElementById('sidebar');
  const backdrop = document.getElementById('sidebar-backdrop');
  sidebar.classList.add('closed');
  sidebar.classList.remove('open');
  backdrop.classList.add('hidden');
  document.body.style.overflow = '';
}

document.getElementById('hamburger-btn').addEventListener('click', () => {
  const sidebar = document.getElementById('sidebar');
  if (sidebar.classList.contains('open')) closeSidebar();
  else openSidebar();
});

// Close on resize
window.addEventListener('resize', () => {
  if (window.innerWidth >= 1024) closeSidebar();
});

// Keyboard close modal
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (!document.getElementById('modal').classList.contains('hidden')) closeModal();
    else closeSidebar();
  }
});

// ========== INIT ==========
function init() {
  buildDomainFilters();
  // Show skeletons briefly then render
  setTimeout(() => {
    renderCards(data);
    document.getElementById('results-count').textContent = data.length;
  }, 400);
}

init();
</script>
</body>
</html>
